name: Deploy production site

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and smoke-test production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ciaranlyons.com
    steps:
      - name: Start deployment timer
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production artifact
        env:
          REQUIRE_WELL_KNOWN: "true"
          ATPROTO_DID: ${{ secrets.ATPROTO_DID }}
          STANDARD_SITE_PUBLICATION_AT_URI: ${{ secrets.STANDARD_SITE_PUBLICATION_AT_URI }}
        run: npm run build:artifact

      - name: Verify locked deployment tooling
        run: |
          expected="$(node -p 'require("./package.json").devDependencies.wrangler')"
          actual="$(node_modules/.bin/wrangler --version)"
          test "$actual" = "$expected"
          echo "Using locked Wrangler $actual"

      - name: Upload production artifact to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          wranglerVersion: "4.152.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ciaranlyons
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment left dependencies unchanged
        if: always()
        run: git diff --exit-code -- package.json package-lock.json

      - name: Smoke-test production
        env:
          SITE_URL: https://ciaranlyons.com
        run: npm run smoke:production

      - name: Record production deployment duration
        if: always()
        env:
          STARTED_AT: ${{ steps.timing.outputs.started_at }}
        run: |
          finished_at=$(date +%s)
          elapsed_seconds=$((finished_at - STARTED_AT))
          {
            echo "## Production deployment timing"
            echo
            echo "- Elapsed checkout-to-result time: ${elapsed_seconds}s"
            echo "- Use the first successful post-cutover run as the baseline; compare later successful runs in this workflow's job summaries."
          } >> "$GITHUB_STEP_SUMMARY"
