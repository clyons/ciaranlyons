name: PR Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate PR body contains ExecPlan path or N/A reason
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json body -q .body > "$RUNNER_TEMP/pr-body.md"
          node scripts/validate-pr-body.mjs --body-file "$RUNNER_TEMP/pr-body.md"

  quality-checks:
    needs: pr-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect Node.js project
        id: node-project
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json found; skipping npm quality checks. Customize this job for non-Node projects."
          fi

      - name: Setup Node.js
        if: steps.node-project.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.node-project.outputs.present == 'true'
        run: npm ci --ignore-scripts

      - name: Lint
        if: steps.node-project.outputs.present == 'true'
        run: npm run lint

      - name: Type check
        if: steps.node-project.outputs.present == 'true'
        run: npx tsc --noEmit

      - name: Test
        if: steps.node-project.outputs.present == 'true'
        run: npm test

      - name: Build
        if: steps.node-project.outputs.present == 'true'
        run: npm run build:artifact
