name: PR Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate PR body contains ExecPlan path or N/A reason
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          BODY="$(gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json body -q .body)"

          has_execplan=0
          has_na_reason=0

          if printf '%s' "$BODY" | grep -Eq '\.agent/execplans/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9._-]+\.md'; then
            has_execplan=1
            PLAN_PATH=$(printf '%s' "$BODY" | grep -Eo '\.agent/execplans/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9._-]+\.md' | head -n 1)
            if [ ! -f "$PLAN_PATH" ]; then
              echo "::error::Referenced ExecPlan does not exist in this PR: $PLAN_PATH"
              exit 1
            fi
          fi

          if printf '%s' "$BODY" | grep -Eq 'N/A reason:[[:space:]]*[[:alnum:]][[:print:]]{14,}'; then
            has_na_reason=1
          fi

          recovery_hint() {
            echo
            echo "::notice::How to recover after editing the PR body:"
            echo "::notice::  This workflow now re-runs automatically on body edits."
            echo "::notice::  If it does not re-fire, push any commit, for example:"
            echo "::notice::  git commit --allow-empty -m rerun"
          }

          if [ "$has_execplan" -eq 0 ] && [ "$has_na_reason" -eq 0 ]; then
            echo "::error::PR body must include an ExecPlan path (for example, .agent/execplans/YYYY-MM-DD-slug.md) or a populated 'N/A reason: <text>' line."
            recovery_hint
            exit 1
          fi

          if ! printf '%s' "$BODY" | grep -q "Validation Evidence"; then
            echo "::error::PR body must include the Validation Evidence section."
            recovery_hint
            exit 1
          fi

          VALIDATION=$(printf '%s\n' "$BODY" | awk '
            /^## Validation Evidence/ { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ')
          VALIDATION_TEXT=$(printf '%s' "$VALIDATION" | tr -d '`<>[:space:]')
          if [ "${#VALIDATION_TEXT}" -lt 20 ] || printf '%s' "$VALIDATION" | grep -Fq '<command output excerpts>'; then
            echo "::error::Validation Evidence must contain substantive command results or an explicit N/A explanation."
            recovery_hint
            exit 1
          fi

  quality-checks:
    needs: pr-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect Node.js project
        id: node-project
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json found; skipping npm quality checks. Customize this job for non-Node projects."
          fi

      - name: Setup Node.js
        if: steps.node-project.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.node-project.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Lint
        if: steps.node-project.outputs.present == 'true'
        run: npm run lint

      - name: Type check
        if: steps.node-project.outputs.present == 'true'
        run: npx tsc --noEmit

      - name: Test
        if: steps.node-project.outputs.present == 'true'
        run: npm test

      - name: Build
        if: steps.node-project.outputs.present == 'true'
        run: npm run build
